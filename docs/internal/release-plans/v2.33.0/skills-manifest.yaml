# Skills changed in this release
#
# Created 2026-08-21 in response to G1 adversarial finding 4, which observed that eight skill
# bumps shipped with no artifact recording which skills changed and how. This file is that
# record.
#
# WHAT THIS FILE DOES NOT DO. It is a record, not an enforcing check. Two earlier versions of this
# header overclaimed, each in a different way, so this one states only what was read out of the
# validator. validate-skills-manifest iterates the rows present here and checks that each row's
# name resolves to a real skill directory. That is the whole check. A row with no parsable name is
# skipped rather than failed; change_type is not validated; a current-version mismatch is a warning,
# not an error; the summary block is not recomputed; CHANGELOG.md is not read. It therefore cannot
# detect a bump that was never written here in the first place, which is the exact failure it was
# created to catch. Closing that gap belongs to the restore-or-retire decision below.
#
# docs/internal/skill-versioning.md has required this file for changed releases since it was
# written. Re-derived 2026-08-25 with `sort -V`: 9 of 44 release folders carry a manifest, 8 of
# them predating this release, and the most recent of those 8 is v2.15.0.
#
# A note on how this line was wrong twice. The original said "most recently v2.8.0", which was a
# lexical sort reading v2.8.0 as later than v2.15.0. The first correction named v2.15.0 but listed
# only five skipped folders; there are SIX (v2.10.0, v2.11.0, v2.11.1, v2.12.0, v2.13.0, v2.15.0).
# Re-derive with `sort -V`, never plain `sort`, and count the result rather than typing it.
#
# No "unobserved for N folders" figure is stated here. The governing rule makes a manifest optional
# for a release that changed no skill, so the denominator is releases-that-changed-skills, which is
# not derivable from a directory listing. Issue 279 (skills-manifest.yaml: restore the convention or
# retire it) tracks the standing decision and owns that denominator. This file does not settle it;
# it supplies the artifact this release was missing.
#
# Every row below was re-derived on 2026-08-21 from
#   git diff v2.32.0..HEAD -- 'skills/*/SKILL.md'
# comparing each SKILL.md's metadata.version against the same file at the v2.32.0 tag, not copied
# from the release plan's prose. change_type is read from each skill's own HISTORY.md row.
#
# NOTE ON THE THREE MAJORS. deliver-prd, develop-adr and measure-instrumentation-spec were drafted
# as minors on 2026-08-16 and retyped to major on 2026-08-21 after the G1 adversarial review found
# that a conditionally required section is still required for the population its condition selects,
# which is the tie-breaker rule's major case in skill-versioning.md. The drafted 2.3.0 / 2.2.0
# versions never shipped. A skill major does not imply a repo major: skill-versioning.md versions
# the repo independently, so v2.33.0 remains a MINOR release.

release: v2.33.0
date: 2026-08-21  # manifest derivation date; the release date is set at G2, the tag is not yet cut
repo_release_type: minor  # unaffected by the three skill majors; see note above

summary:
  skills_changed: 8
  major: 3
  minor: 4
  patch: 1

skills:
  - name: deliver-prd
    version: 3.0.0
    previous_version: 2.2.0
    change_type: major
    effort: C-1
    note: >-
      Conditional AI Behavior and Evaluation and Agent Execution Contract sections, plus a
      replacement evaluation-set sizing method: risk-based coverage floors rather than saturation
      stopping, with the block declining to license a failure-rate claim (D15, G1 round 3).
      Retyped from a drafted 2.3.0 minor; 2.3.0 never shipped.

  - name: develop-adr
    version: 3.0.0
    previous_version: 2.1.0
    change_type: major
    effort: C-1
    note: >-
      Conditional Model Choice subsection inside Consequences. Retyped from a drafted 2.2.0
      minor; 2.2.0 never shipped.

  - name: measure-instrumentation-spec
    version: 3.0.0
    previous_version: 2.2.0
    change_type: major
    effort: C-1
    note: >-
      Conditional Model Trace Capture subsection under PII and Privacy, with the trigger
      broadened from user input only to any captured model input, output, retrieval context or
      tool call, and a data-classes decision added. Retyped from a drafted 2.3.0 minor; 2.3.0
      never shipped.

  - name: define-prioritization-framework
    version: 1.3.0
    previous_version: 1.2.0
    change_type: minor
    effort: C-14
    issue: 252
    note: >-
      Field-report calibration. One bump crediting two workstreams; counted once here, which is
      why this cycle has eight changed skills across nine bump events.

  - name: discover-journey-map
    version: 1.3.0
    previous_version: 1.2.0
    change_type: minor
    effort: C-14

  - name: foundation-build-risk-review
    version: 1.1.0
    previous_version: 1.0.1
    change_type: minor
    effort: C-14

  - name: measure-survey-analysis
    version: 1.3.0
    previous_version: 1.2.0
    change_type: minor
    effort: C-14

  - name: foundation-persona
    version: 2.6.1
    previous_version: 2.6.0
    change_type: patch
    effort: C-14
    issue: 251
    note: Example contradicted its own template; prose fix, no contract change.
