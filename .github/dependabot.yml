version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm (for .github/scripts)
  - package-ecosystem: "npm"
    directory: "/.github/scripts"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      scripts-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm (Astro Starlight docs site; relocated under site/ in the Pattern S move)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      site-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
